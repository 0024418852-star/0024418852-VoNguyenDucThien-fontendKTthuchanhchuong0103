<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Đăng nhập hoặc tạo tài khoản EduHub.">
  <title>Đăng nhập — EduHub</title>
  <link rel="icon" href="img/event.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">EduHub</a>
    <nav aria-label="Menu chính">
      <ul>
        <li><a href="index.html">Sự kiện</a></li>
        <li><a href="my-registrations.html">Đăng ký của tôi</a></li>
        <li id="auth-slot"></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1>Tài khoản</h1>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div class="auth-grid">
      <section aria-labelledby="login-title">
        <h2 id="login-title">Đăng nhập</h2>
        <form id="login-form" class="form">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" required autocomplete="email">
          <label for="login-password">Mật khẩu</label>
          <input type="password" id="login-password" name="password" required autocomplete="current-password">
          <button type="submit" class="btn btn-primary">Đăng nhập</button>
        </form>
      </section>
      <section aria-labelledby="register-title">
        <h2 id="register-title">Tạo tài khoản</h2>
        <form id="register-form" class="form">
          <label for="reg-student-id">Mã sinh viên</label>
          <input type="text" id="reg-student-id" name="studentId" required>
          <label for="reg-name">Họ và tên</label>
          <input type="text" id="reg-name" name="name" required autocomplete="name">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" name="email" required autocomplete="email">
          <label for="reg-password">Mật khẩu (tối thiểu 8 ký tự)</label>
          <input type="password" id="reg-password" name="password" required minlength="8" autocomplete="new-password">
          <button type="submit" class="btn btn-primary">Tạo tài khoản</button>
        </form>
      </section>
    </div>
  </main>
  <footer class="site-footer">
    <p>&copy; 2026 EduHub</p>
  </footer>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
